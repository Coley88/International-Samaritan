<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholars | ISJ Admin Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <aside class="sidebar admin-sidebar">
    <img src="images/isj-logo.png" alt="ISJ Logo" class="sidebar-logo" />
    <h2>Admin Portal</h2>

    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-scholars.html" class="active">Scholars</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-meetings.html">Meetings</a>
    <a href="admin-assistance.html">Assistance</a>
    <a href="admin-messages.html">Messages</a>
    <a href="login.html">Logout</a>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div>
        <h1>Scholar List</h1>
        <p>View and manage all scholars in the scholarship program.</p>
      </div>
    </header>

    <section class="content-panel">
      <div class="panel-top">
        <h2>All Scholars</h2>

        <input
          type="search"
          id="scholarSearchInput"
          placeholder="Search scholar by name, school, grade, email, or path..."
          class="search-box"
          oninput="filterAdminScholars()"
        />
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Scholar Name</th>
              <th>Email</th>
              <th>Age</th>
              <th>School</th>
              <th>Grade/Year</th>
              <th>Years Supported</th>
              <th>Current Path</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="adminScholarsTableBody">
            <tr>
              <td colspan="8">Loading scholars...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>

  <script>
    loadAdminScholars();
  </script>

</body>
</html>
