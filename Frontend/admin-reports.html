<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uploaded Reports | ISJ Admin Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <aside class="sidebar admin-sidebar">
    <img src="images/isj-logo.png" alt="ISJ Logo" class="sidebar-logo" />
    <h2>Admin Portal</h2>

    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-scholars.html">Scholars</a>
    <a href="admin-reports.html" class="active">Reports</a>
    <a href="admin-meetings.html">Meetings</a>
    <a href="admin-assistance.html">Assistance</a>
    <a href="admin-messages.html">Messages</a>
    <a href="login.html">Logout</a>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div>
        <h1>Uploaded Reports</h1>
        <p>Review academic reports, transcripts, images, and submitted documents.</p>
      </div>
    </header>

    <section class="content-panel">
      <div class="panel-top">
        <h2>Report Submissions</h2>

        <select id="reportStatusFilter" class="filter-box" onchange="loadAdminReports()">
          <option value="All">All Reports</option>
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Need Correction">Need Correction</option>
          <option value="Reviewed">Reviewed</option>
        </select>
      </div>

      <div id="adminReportsContainer" class="request-grid">
        <p>Loading reports...</p>
      </div>
    </section>
  </main>
<script src="js/app.js"></script>

<script>
  loadAdminReports();
</script>
</body>
</html>
